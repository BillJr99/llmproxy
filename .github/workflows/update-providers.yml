name: Update providers.json

# Refreshes llmproxy/providers.json (and the regenerated config.example.json) by
# running the free-models scraper and opening a pull request against main when the
# data changes. It uses only the read-only sources (provider docs, /models
# catalogs, OpenRouter, the litellm cost map, the community list) — it never runs
# the opt-in `probe` source, so no real model requests / quota are spent here.
#
# Manual only: trigger it from the Actions tab → "Update providers.json" → Run
# workflow (or via `gh workflow run update-providers.yml`). There is no schedule,
# so a refresh happens exactly when you ask for it. Because it runs in Actions on
# the current main code, its output is always self-consistent (canonical
# providers.json + a matching config.example.json), so the PR it opens passes CI.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh providers.json from sources (no model probing)
        id: scrape
        run: |
          python scripts/update_free_models.py
          echo "----- git status after scrape -----"
          git status --porcelain llmproxy/providers.json config.example.json || true
          # Record whether the tracked data files actually changed so the PR step
          # is skipped entirely on a no-op run (no empty branch / PR is opened).
          if [ -n "$(git status --porcelain llmproxy/providers.json config.example.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to providers.json / config.example.json — skipping PR."
          fi

      - name: Open a pull request if anything changed
        if: steps.scrape.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh believed_free / free_limits / pricing in providers.json"
          branch: chore/update-providers
          delete-branch: true
          title: "chore: automated providers.json refresh"
          labels: automated, providers-data
          add-paths: |
            llmproxy/providers.json
            config.example.json
          body: |
            Automated refresh of `llmproxy/providers.json` (and the regenerated
            `config.example.json`) by the **Update providers.json** workflow.

            Sources: provider docs, `/models` catalogs, OpenRouter, the litellm
            cost map, and the community list. The opt-in `probe` source (which
            sends real model requests) is **not** run here.

            Review the diff before merging — free-tier status is best-effort and
            changes without notice.
