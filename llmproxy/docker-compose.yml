# ============================================================
# llmproxy — docker-compose.yml
# ============================================================
#
# Before first use, generate a .env file with your UID/GID so that
# files written inside the container are owned by your host user:
#
#   printf "UID=%s\nGID=%s\n" "$(id -u)" "$(id -g)" > .env
#   mkdir -p ~/.config/llmproxy
#
# Quick start (runs the proxy server):
#   docker-compose up -d
#
# First-time setup / reconfigure:
#   docker-compose run --rm setup
#
# After setup, apply new config without rebuilding:
#   docker-compose restart llmproxy
#
# View logs:
#   docker-compose logs -f llmproxy
#
# Stop and remove containers (host config directory is preserved):
#   docker-compose down
#
# Named-volume alternative:
#   Replace the bind-mount volume entries below with:
#     volumes:
#       - llmproxy_config:/root/.config/llmproxy
#   Remove the LLMPROXY_CONFIG environment entry.
#   Add a top-level volumes: section:
#     volumes:
#       llmproxy_config:
#         name: llmproxy_config
# ============================================================

services:

  # ── Proxy server ────────────────────────────────────────
  llmproxy:
    build: .
    image: llmproxy:latest
    container_name: llmproxy
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${LLMPROXY_PORT:-8080}:8080"
    volumes:
      - "${HOME}/.config/llmproxy:/config"
    environment:
      - LLMPROXY_CONFIG=/config/config.json
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Interactive setup service ────────────────────────────
  # Usage:  docker-compose run --rm setup
  #
  # Runs the wizard in a temporary container that shares the same
  # host config directory as the server.  The server container does
  # NOT need to be stopped; restart it after setup to apply changes.
  setup:
    build: .
    image: llmproxy:latest
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - "${HOME}/.config/llmproxy:/config"
    environment:
      - LLMPROXY_CONFIG=/config/config.json
    entrypoint: ["python", "-m", "llmproxy", "--setup"]
    stdin_open: true   # -i
    tty: true          # -t
    profiles:
      - setup          # only started when explicitly requested
