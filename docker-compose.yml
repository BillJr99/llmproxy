# ============================================================
# llmproxy — docker-compose.yml
# ============================================================
#
# Prerequisites: create a .env file with your UID so that bind-mounted config
# files are owned by you on the host, and create the config directory yourself
# so Docker does not create it as root:
#
#   printf "UID=%s\n" "$(id -u)" > .env
#   mkdir -p ~/.config/llmproxy
#
# The group stays 0. The image's writable directories are group-root (see the
# Dockerfile's useradd stanza), so a host GID of 1000 cannot write them; group 0
# grants no root privilege here, because the UID is still yours. Machine-written
# state (routing_metadata.json, flagship_models.json, the refresh timestamps,
# and shared_state.db when server.workers > 1) goes to the llmproxy_state volume
# rather than onto the config mount, so the config directory can be read-only if
# you want it to be.
#
# That volume must be a LOCAL filesystem. shared_state.db is SQLite in WAL mode,
# which needs an mmap'd -shm region that NFS and SMB cannot provide; a network
# bind mount there is reported at startup and the worker count drops to 1.
#
# Quick start (runs the proxy server):
#   docker-compose up -d
#
# First-time setup / reconfigure:
#   docker-compose run --rm setup
#
# After setup, apply new config without rebuilding:
#   docker-compose restart llmproxy
#
# View logs:
#   docker-compose logs -f llmproxy
#
# Stop and remove containers (host config directory is preserved):
#   docker-compose down
#
# ============================================================

services:

  # ── Proxy server ────────────────────────────────────────
  llmproxy:
    build: .
    image: llmproxy:latest
    container_name: llmproxy
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-0}"
    ports:
      - "${LLMPROXY_PORT:-8080}:8080"
    # Public resolvers so upstream provider domains keep resolving even when the
    # host's DNS (or Docker's embedded 127.0.0.11 forwarder) is misconfigured —
    # a common cause of "cannot resolve api.<provider>.com" after a Docker update.
    # Docker writes these into the container's /etc/resolv.conf (they replace the
    # default resolver list). Edit or remove this block to use the host resolvers.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - "${HOME}/.config/llmproxy:/config"
      - "llmproxy_state:/state"
    environment:
      - LLMPROXY_CONFIG=/config/config.json
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Interactive setup service ────────────────────────────
  # Usage:  docker-compose run --rm setup
  #
  # Runs the wizard in a temporary container that bind-mounts the same
  # host config directory as the server.  The server container does NOT
  # need to be stopped; restart it after setup to apply host/port changes.
  setup:
    build: .
    image: llmproxy:latest
    user: "${UID:-1000}:${GID:-0}"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - "${HOME}/.config/llmproxy:/config"
      - "llmproxy_state:/state"
    environment:
      - LLMPROXY_CONFIG=/config/config.json
    entrypoint: ["python", "-m", "llmproxy", "--setup"]
    stdin_open: true   # -i
    tty: true          # -t
    profiles:
      - setup          # only started when explicitly requested

# ── Volumes ──────────────────────────────────────────────
# The state llmproxy accumulates, meaning routing metadata, flagship membership
# and the last-run timestamps that throttle all three background refreshes, is
# worth keeping across `docker-compose down`, but it is machine-written and does
# not belong in the hand-edited config directory. A named volume keeps it out of
# the way while still surviving the container.
volumes:
  llmproxy_state:
